out_dir: results
metric_best: f1
num_workers: 6
wandb:
  use: false
  project: COCO
dataset:
  format: AW-Prepared
  name: coco-sp
  task: graph
  task_type: classification
  transductive: false
  node_encoder: true
  node_encoder_name: COCONodeNorm
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: COCOEdgeNorm
  edge_encoder_bn: false
posenc_LapPE:
  enable: false
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
train:
  mode: custom
  batch_size: 50
  eval_period: 1
  ckpt_period: 100
  eval_smoothing_metrics: true
model:
  type: GPSModel
  loss_fun: weighted_cross_entropy
gt:
  layer_type: CustomGatedGCN+Transformer
  layers: 8
  n_heads: 4
  dim_hidden: 68
  dropout: 0.1
  attn_dropout: 0.5
  layer_norm: true
  batch_norm: false
gnn:
  head: inductive_node
  layers_pre_mp: 0
  layers_post_mp: 1
  dim_inner: 68
  batchnorm: true
  act: gelu
  dropout: 0.1
  agg: mean
  normalize_adj: false
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 200
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
