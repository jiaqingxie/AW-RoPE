[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-rope"
version = "0.1.0"
description = "Sparse Analytic Walk Rotary Position Encodings for graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4,<2.8",
]

[project.optional-dependencies]
data = [
  "networkx>=2.8",
  "numpy>=1.26,<2",
  "ogb==1.3.6",
  "pandas>=2",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch-geometric==2.5.3",
]
test = [
  "pytest>=8",
]
wire = [
  "h5py>=3.11,<4",
  "performer-pytorch>=1.1.4",
  "tensorboardX>=2.6",
  "torchmetrics>=1.5,<1.6",
  "yacs>=0.1.8",
]

[project.scripts]
aw-rope-train = "aw_rope.experiments.train:main"
aw-rope-grid = "aw_rope.experiments.grid:main"
aw-rope-pipeline = "aw_rope.experiments.pipeline:main"
aw-rope-report = "aw_rope.experiments.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "external/Graph-RoPE"]
addopts = "-q"
